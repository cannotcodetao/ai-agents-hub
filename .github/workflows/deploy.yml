name: Build & Publish hub

# ────────────────────────────────────────────────────────────────
# 子站 hub：Vite + React 构建后把产物推到 dist 分支。
#
# 【2026-11-04 架构调整】部署不再由 Actions SSH 进服务器完成，改为：
#   Actions 构建 → 推 dist 分支（用内置 GITHUB_TOKEN）→ 服务器 site-pull 拉取 dist
# 好处：仓库不需要 SERVER_HOST / SSH_PRIVATE_KEY 任何 Secret，新建仓库零配置。
# 服务器侧逻辑见 my-sites/server/site-pull.sh（/www/bin/site-pull.sh）。
#
# 为什么服务器不自己构建：服务器上没有 node，而且 Vite 构建依赖版本锁定，
# 放在 Actions 上更可控。所以这个仓库保留 push 触发，只做「构建 + 推 dist」。
# ────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-hub
  cancel-in-progress: false

# 推 dist 分支需要写权限；这是 GitHub 自动提供的令牌，不需要人工配置 Secret
permissions:
  contents: write

env:
  SITE_NAME: hub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build
        run: |
          set -e
          npm ci
          npm run build

          rm -rf _release && mkdir -p _release
          cp -r dist/. _release/

          # ── 构建产出验收：任何一条不过就中止 ───────────────────
          test -f _release/index.html || { echo "❌ 缺少 index.html"; exit 1; }
          test -d _release/data   || { echo "❌ 缺少 data/ 目录"; exit 1; }
          test -f _release/data/agents.json || { echo "❌ 缺少 data/agents.json"; exit 1; }

          # base 必须是 /hub/，否则部署到子目录后资源全 404
          if ! grep -q '"/hub/' _release/index.html; then
            echo "❌ index.html 中未发现 /hub/ 前缀，vite base 配置可能被改回 '/'"
            echo "--- 实际引用 ---"
            grep -oE '(src|href)="[^"]*"' _release/index.html || true
            exit 1
          fi

          echo "✅ 构建验收通过"
          echo "--- _release 顶层 ---"
          ls -la _release
          echo "--- 资源引用前缀 ---"
          grep -oE '(src|href)="/[^"]*"' _release/index.html

      # ── 产物推到 dist 分支，供服务器 site-pull 拉取 ──────────────
      # GITHUB_TOKEN 是 Actions 内置令牌，无需任何人工 Secret。
      # 用 -f 强推：dist 是纯生成物，不需要历史。
      - name: Publish to dist branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd _release
          git init -q -b dist
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dist: ${GITHUB_SHA::7} · run ${GITHUB_RUN_NUMBER}"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:dist
          echo "✅ 已推送 dist 分支：$(git rev-parse --short HEAD)"
          echo "   服务器将在下一次轮询（≤2 分钟）内拉取并发布"
