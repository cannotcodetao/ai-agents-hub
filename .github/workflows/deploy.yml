name: Deploy hub

# 子站 hub：Vite + React 构建后发布到 /www/releases/hub/<版本>/，软链接切换生效。
# 仓库根 -> 构建 -> _release/ -> rsync -> 原子切链接 -> 清理旧版本

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hub
  cancel-in-progress: false

env:
  # ↓↓↓ 需要按实际环境修改：站点根目录 ↓↓↓
  SITE_ROOT: /www/wwwroot/cannotcode.cn
  # ↑↑↑
  SITE_NAME: hub
  RELEASES_ROOT: /www/releases
  SERVER_USER: root
  KEEP_RELEASES: 5

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build
        run: |
          set -e
          npm ci
          npm run build

          rm -rf _release && mkdir -p _release
          cp -r dist/. _release/

          # ── 构建产出验收：任何一条不过就中止部署 ───────────────
          test -f _release/index.html || { echo "❌ 缺少 index.html"; exit 1; }
          test -d _release/data   || { echo "❌ 缺少 data/ 目录"; exit 1; }
          test -f _release/data/agents.json || { echo "❌ 缺少 data/agents.json"; exit 1; }

          # base 必须是 /hub/，否则部署到子目录后资源全 404
          if ! grep -q '"/hub/' _release/index.html; then
            echo "❌ index.html 中未发现 /hub/ 前缀，vite base 配置可能被改回 '/'"
            echo "--- 实际引用 ---"
            grep -oE '(src|href)="[^"]*"' _release/index.html || true
            exit 1
          fi

          echo "✅ 构建验收通过"
          echo "--- _release 顶层 ---"
          ls -la _release
          echo "--- 资源引用前缀 ---"
          grep -oE '(src|href)="/[^"]*"' _release/index.html

      - name: Resolve release name (UTC)
        id: vars
        run: echo "release=${SITE_NAME}/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Prepare release directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            mkdir -p "${{ env.RELEASES_ROOT }}/${{ steps.vars.outputs.release }}"

      - name: Rsync to release directory
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: _release/
          remote_path: ${{ env.RELEASES_ROOT }}/${{ steps.vars.outputs.release }}/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ env.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Switch symlink (atomic) and cleanup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            TARGET="${{ env.RELEASES_ROOT }}/${{ steps.vars.outputs.release }}"
            LINK="${{ env.SITE_ROOT }}/${{ env.SITE_NAME }}"

            # 【关键】目标是实体目录时，ln -sfn 会在目录内部建链接而非替换，必须先把实体目录移走
            if [ -d "$LINK" ] && [ ! -L "$LINK" ]; then
              LEGACY="${LINK}.legacy.$(date -u +%Y%m%d%H%M%S)"
              mv "$LINK" "$LEGACY"
              echo "⚠️ 检测到实体目录，已移至 $LEGACY（确认后可删除）"
            fi

            ln -sfn "$TARGET" "${LINK}.new"
            mv -f "${LINK}.new" "$LINK"

            echo "✅ 已切换 $LINK -> $(readlink "$LINK")"
            test -f "$LINK/index.html" || { echo "❌ index.html 不存在"; exit 1; }
            test -f "$LINK/data/agents.json" || { echo "❌ data/agents.json 不存在"; exit 1; }

            /www/scripts/cleanup.sh hub "${{ env.KEEP_RELEASES }}"
